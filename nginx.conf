# ============================================
# nginx.conf — Configuración del servidor para Railway
# PROPÓSITO: Servir los archivos estáticos del sitio
#            en el puerto que Railway inyecta via $PORT
# ============================================

server {
    # Railway inyecta la variable de entorno PORT en cada deploy.
    # El Dockerfile la reemplaza aquí con sed antes de arrancar nginx.
    listen __PORT__;

    # Raíz del sitio: donde el Dockerfile copió los archivos HTML/CSS/JS
    root /usr/share/nginx/html;

    # Archivo por defecto cuando se pide una carpeta
    index index.html;

    # ——— MANEJO DE RUTAS ———
    location / {
        # Busca en este orden:
        # 1. El archivo exacto ($uri)         → /css/styles.css ✓
        # 2. Como carpeta con index ($uri/)   → /sobre-nosotros/ → sobre-nosotros/index.html
        # 3. Con extensión .html ($uri.html)  → /servicios → servicios.html
        # 4. Si nada funciona → 404.html
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Página 404 personalizada
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ——— CACHÉ Y RENDIMIENTO ———

    # Archivos estáticos: caché de 1 año (solo cambian cuando cambia el nombre del archivo)
    location ~* \.(css|js|webp|jpeg|jpg|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: sin caché agresivo (puede cambiar con cada deploy)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # sitemap.xml y robots.txt: caché corta
    location ~* \.(xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ——— COMPRESIÓN GZIP ———
    # Reduce el tamaño de transferencia de HTML/CSS/JS
    gzip on;
    gzip_types
        text/html
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/xml
        application/xml;
    gzip_min_length 256;
    gzip_vary on;

    # ——— SEGURIDAD ———
    # Oculta la versión de nginx para no revelar información al atacante
    server_tokens off;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
